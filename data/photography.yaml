# Photography gallery metadata, keyed by the image's base filename.
#
#   alt     — what a screen reader announces: a brief description, then where.
#   caption — the visible line under the frame: what the picture is of. No
#             full stop at the end. May contain <em>; rendered with safeHTML.
#             Foreign common nouns are italicised, as they normally are.
#   place   — "<Town>, <Country>", set after the caption in italics. The
#             template puts the full stop between the two, so neither field
#             carries one. Leave it out and the caption stands alone.
#   title   — short line shown as the browser tooltip on hover,
#             "<Subject>. <Place>" or "<Place>, <Town>".
#
# A frame with no entry here still appears in the gallery, with no caption.
#
# French uses the French exonyms where they exist (le Cervin for the
# Matterhorn, le Léman for Lake Geneva) rather than transliterating the English.
#
# `credit` is rendered once at the foot of the gallery, not on every frame.

credit: "© Remi Seddigh"

# Rendered after the credit, as a mailto link to params.email.
credit_note:
  en: "Please get in touch if you would like to use one of these pictures."
  fr: "Contactez-moi si vous souhaitez utiliser une de ces photos."

